voxel_size: [0.2, 0.2, 0.2]

model:
  encoders:
    lidar: null
    camera:
      backbone:
        type: ResNet
        depth: 50
        num_stages: 4
        out_indices: [1, 2, 3]
        frozen_stages: 1
        norm_cfg:
          type: BN2d
          requires_grad: true
        norm_eval: true
        style: pytorch
        with_cp: true
        init_cfg:
          type: Pretrained
          checkpoint: https://download.pytorch.org/models/resnet50-0676ba61.pth
      neck:
        type: GeneralizedLSSFPN
        in_channels: [512, 1024, 2048]
        out_channels: 256
        start_level: 0
        num_outs: 3
        norm_cfg:
          type: BN2d
          requires_grad: true
        act_cfg:
          type: ReLU
          inplace: true
        upsample_cfg:
          mode: bilinear
          align_corners: false
      vtransform:
        type: LSSTransform
        in_channels: 256
        out_channels: 80
        image_size: ${image_size}
        feature_size: ${[image_size[0] // 8, image_size[1] // 8]}
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10.0, 10.0, 20.0]
        dbound: [1.0, 60.0, 0.5]
        downsample: 2
  fuser: null
  decoder:
    backbone:
      type: GeneralizedResNet
      in_channels: 80
      blocks:
        - [2, 160, 2]
        - [2, 320, 2]
        - [2, 640, 1]
    neck:
      type: LSSFPN
      in_indices: [-1, 0]
      in_channels: [640, 160]
      out_channels: 256
      scale_factor: 2

optimizer:
  type: AdamW
  lr: 2.0e-4
  weight_decay: 0.01

optimizer_config:
  grad_clip:
    max_norm: 35
    norm_type: 2

lr_config:
  policy: cyclic

momentum_config:
  policy: cyclic

log_config:
  interval: 50
  hooks:
    -
      type: TextLoggerHook

fp16: null
